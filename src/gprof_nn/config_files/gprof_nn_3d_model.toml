name = "gprof_nn_3d"

[architecture]
name = "EncoderDecoder"
preset = "EfficientNetV2-S"

[architecture.encoder]
channels = [29, 58, 77, 154, 192, 307]
downsampling_factors = [[1, 1], [2, 2], [2, 2], [2, 2], [2, 1]]
stage_depths = [1, 2, 2, 3, 3, 4]
block_factory = [
    "InvertedBottleneck",
    "InvertedBottleneck",
    "InvertedBottleneck",
    "InvertedBottleneck",
    "InvertedBottleneck",
    "InvertedBottleneck",
]
block_factory_args = [
    {activation_factory="GELU", normalization_factory="LayerNormFirst", expansion_factor=1, excitation_ratio=0.0, fused=true, anti_aliasing=false},
    {activation_factory="GELU", normalization_factory="LayerNormFirst", expansion_factor=4, excitation_ratio=0.0, fused=true, anti_aliasing=false},
    {activation_factory="GELU", normalization_factory="LayerNormFirst", expansion_factor=4, excitation_ratio=0.0, fused=true, anti_aliasing=false},
    {activation_factory="GELU", normalization_factory="LayerNormFirst", expansion_factor=4, excitation_ratio=0.0, anti_aliasing=false},
    {activation_factory="GELU", normalization_factory="LayerNormFirst", expansion_factor=6, excitation_ratio=0.0, anti_aliasing=false},
    {activation_factory="GELU", normalization_factory="LayerNormFirst", expansion_factor=6, excitation_ratio=0.0, anti_aliasing=false},
]

[architecture.decoder]
channels = [192, 154, 128, 128]
upsampling_factors = [[2, 1], [2, 2], [2, 2], [2, 2]]
stage_depths = [3, 3, 2, 2]
block_factory = [
    "InvertedBottleneck",
    "InvertedBottleneck",
    "InvertedBottleneck",
    "InvertedBottleneck",
]
block_factory_args = [
    {activation_factory="GELU", normalization_factory="LayerNormFirst", expansion_factor=6, excitation_ratio=0.0, anti_aliasing=false},
    {activation_factory="GELU", normalization_factory="LayerNormFirst", expansion_factor=4, excitation_ratio=0.0, anti_aliasing=false},
    {activation_factory="GELU", normalization_factory="LayerNormFirst", expansion_factor=4, excitation_ratio=0.0, fused=true, anti_aliasing=false},
    {activation_factory="GELU", normalization_factory="LayerNormFirst", expansion_factor=4, excitation_ratio=0.0, fused=true, anti_aliasing=false},
]
skip_connections=true

[architecture.head]
individual = false
kind = "BasicConv"
depth = 4
activation_factory = "GELU"
normalization_factory = "LayerNormFirst"

[input.brightness_temperatures]
n_features = 15
normalize = "minmax"

[input.earth_incidence_angles]
n_features = 15
normalize = "minmax"

[input.ancillary_data]
n_features = 14
normalize = "minmax"

[output.surface_precip]
kind = "Quantiles"
quantiles = 32
shape = 1

[output.convective_precip]
kind = "Quantiles"
quantiles = 32
shape = 1

[output.rain_water_path]
kind = "Quantiles"
quantiles = 32
shape = 1

[output.ice_water_path]
kind = "Quantiles"
quantiles = 32
shape = 1

[output.cloud_water_path]
kind = "Quantiles"
quantiles = 32
shape = 1

[output.rain_water_content]
kind = "Quantiles"
quantiles = 32
shape = 28

[output.snow_water_content]
kind = "Quantiles"
quantiles = 32
shape = 28

[output.cloud_water_content]
kind = "Quantiles"
quantiles = 32
shape = 28

[output.latent_heat]
kind = "Quantiles"
quantiles = 32
shape = 28
