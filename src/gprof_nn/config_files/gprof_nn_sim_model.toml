name = "gprof_nn_sim"

[architecture]
name = "Satformer"
output_embed_dim = 49

[architecture.encoder]
channels = [49, 64, 128, 256, 512]
stage_depths = [1, 2, 3, 3, 4]
block_factory_args = [
    {{expansion_factor=1, excitation_ratio=0.0, fused=true, attention=false, activation_factory="GELU", normalization_factory="LayerNormFirst"}},
    {{expansion_factor=2, excitation_ratio=0.0, fused=true, attention=true, activation_factory="GELU", normalization_factory="LayerNormFirst", stochastic_depth=0.9}},
    {{expansion_factor=2, excitation_ratio=0.0, fused=true, attention=true, activation_factory="GELU", normalization_factory="LayerNormFirst", stochastic_depth=0.8}},
    {{expansion_factor=2, excitation_ratio=0.0, anti_aliasing=true, attention=true, activation_factory="GELU", normalization_factory="LayerNormFirst", stochastic_depth=0.7}},
    {{expansion_factor=2, excitation_ratio=0.0, anti_aliasing=true, attention=true, activation_factory="GELU", normalization_factory="LayerNormFirst", stochastic_depth=0.6}},
]

[architecture.decoder]
channels = [256, 128, 64, 49]
stage_depths = [3, 3, 2, 2]
upsampling_factory = "BilinearWNorm"
block_factory_args = [
    {{expansion_factor=2, excitation_ratio=0.0, anti_aliasing=true, attention=true, activation_factory="GELU", normalization_factory="LayerNormFirst", stochastic_depth=0.7}},
    {{expansion_factor=2, excitation_ratio=0.0, anti_aliasing=true, attention=true, activation_factory="GELU", normalization_factory="LayerNormFirst", stochastic_depth=0.8}},
    {{expansion_factor=2, excitation_ratio=0.0, fused=true, attention=true, activation_factory="GELU", normalization_factory="LayerNormFirst", stochastic_depth=0.9}},
    {{expansion_factor=2, excitation_ratio=0.0, fused=true, attention=true, activation_factory="GELU", normalization_factory="LayerNormFirst"}},
]

[architecture.encoding.observations]
channels_in = 8
channels_out = 49
hidden_channels = 49
depth = 3
activation_factory = "GELU"
normalization_factory = "LayerNorm"
normalize = "minmax"
input_name = "input_observation_props"

[architecture.stem]
kind = "BasicConv3d"
kernel_size = [1, 3, 3]
individual = false
out_channels = 49
depth = 1
normalize_output = "LayerNormFirst"

[input.observations]
n_features = 1
meta_data = "input_observation_props"
encoding = "observations"
mask = "input_observation_mask"
normalize = "minmax"

[meta_data.input_observation_props]
n_features = 8

[input.land_fraction]
n_features = 1
mask = "land_fraction_mask"
normalize = "minmax"

[input.mountain_type]
n_features = 1
mask = "mountain_type_mask"
normalize = "minmax"

[input.elevation]
n_features = 1
mask = "elevation_mask"
normalize = "minmax"

[input.leaf_area_index]
n_features = 1
mask = "leaf_area_index_mask"
normalize = "minmax"

[input.leaf_area_index_climatology]
n_features = 1
mask = "leaf_area_index_climatology_mask"
normalize = "minmax"

[input.two_meter_temperature]
n_features = 1
mask = "two_meter_temperature_mask"
normalize = "minmax"

[input.total_column_water_vapor]
n_features = 1
normalize = "minmax"
mask = "total_column_water_vapor_mask"

[input.orographic_wind]
n_features = 1
normalize = "minmax"
mask = "orographic_wind_mask"

[input.10m_wind]
n_features = 1
normalize = "minmax"
mask = "10m_wind_mask"

[input.moisture_convergence]
n_features = 1
normalize = "minmax"
mask = "moisture_convergence_mask"

[input.convective_precipitation_mask]
n_features = 1
normalize = "minmax"
mask = "convective_precipitation_mask"

[input.ice_fraction]
n_features = 1
normalize = "minmax"
mask = "ice_fraction_mask"

[input.snow_depth]
n_features = 1
normalize = "minmax"
mask = "snow_depth_mask"

[input.ir_observations]
n_features = 2
normalize = "minmax"
mask = "ir_observations_mask"

[output.output_observations]
kind = "Quantiles"
quantiles = 32
shape = 1
conditional = "output_observation_props"
encoding = "observations"
transformation = "MinMax"
transformation_args = {{"x_min"=50, "x_max"=350}}
